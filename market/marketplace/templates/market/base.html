<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}NFT Marketplace Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100">
    <div class="flex h-screen">
      <!-- Sidebar -->
      <aside
        class="w-64 bg-gradient-to-b from-blue-900 to-blue-700 text-white flex-shrink-0"
      >
        <div class="p-6">
          <h1 class="text-2xl font-bold">
            <i class="fas fa-gem mr-2"></i>NFT Admin
          </h1>
        </div>
        <nav class="space-y-2 px-4">
          <a
            href="/"
            class="flex items-center px-4 py-3 rounded-lg hover:bg-blue-800 transition-colors"
          >
            <i class="fas fa-home w-6"></i>
            <span>Dashboard</span>
          </a>
          <a
            href="/nfts/"
            class="flex items-center px-4 py-3 rounded-lg hover:bg-blue-800 transition-colors"
          >
            <i class="fas fa-images w-6"></i>
            <span>NFTs</span>
          </a>
          <a
            href="/transactions/"
            class="flex items-center px-4 py-3 rounded-lg hover:bg-blue-800 transition-colors"
          >
            <i class="fas fa-exchange-alt w-6"></i>
            <span>Transactions</span>
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Header -->
        <header class="bg-white shadow-sm">
          <div class="px-6 py-4">
            <h2 class="text-2xl font-semibold text-gray-800">
              {% block page_title %}Dashboard{% endblock %}
            </h2>
          </div>
        </header>

        <!-- Content Area -->
        <main class="flex-1 overflow-y-auto p-6">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    {% block extra_js %}{% endblock %}
  </body>
</html>
